<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trekkinero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- === CAMBIO 1: AGREGAR ESTA LÍNEA === -->
  <link rel="icon" type="image/png" href="trek.png">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Encabezado -->
  <header class="bg-emerald-800 text-white p-2 sticky top-0 z-50 w-auto shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center">

      <!-- === CAMBIO 2: REEMPLAZAR h1 POR ESTO === -->
      <a href="#" class="block">
        <img src="LogoTrekk.png" alt="Trekk Logo" class="h-16 w-80">
      </a>

      <!--<h1 class="text-2xl font-bold tracking-wider uppercase">Trekkinero</h1>-->
      <button onclick="toggleCart()" class="relative p-5 text-xl">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count" class="absolute -top-0 -right-1 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Barra de Búsqueda y Filtros de Categoría -->
    <div class="mb-6 space-y-4">
      <!-- Buscador con X perfectamente centrada -->
      <div class="relative max-w-md mx-auto sm:mx-0">
        <input type="text" id="search-input" onkeyup="toggleClearButton(); filterProducts();" placeholder="Buscar producto o marca..." 
               class="w-full pl-10 pr-10 py-2.5 rounded-full border border-gray-300 focus:outline-none focus:border-[#0b6643] text-sm bg-white shadow-sm">
        
        <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
        
        <!-- Botón X con alineación centrada y suave -->
        <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 p-1 rounded-full focus:outline-none transition-colors items-center justify-center">
          <i class="fas fa-times-circle text-base leading-none"></i>
        </button>
      </div>
    
    <!-- Filtros de Categoría -->
    <div class="flex gap-2 overflow-x-auto pb-4 mb-6">
      <button onclick="filterCategory('todos')" class="px-4 py-2 bg-black text-white rounded-full text-sm font-medium whitespace-nowrap">Todos</button>
      <button onclick="filterCategory('gorras')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-200">Gorras</button>
      <button onclick="filterCategory('sombreros')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-200">Sombreros</button>
      <button onclick="filterCategory('varios')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-200">Varios</button>
    </div>

    <!-- Rejilla de Productos -->
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
      <!-- Productos inyectados por JavaScript -->
    </div>
  </main>

  <!-- Modal Guía de Tallas -->
  <div id="size-guide-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4" onclick="closeSizeGuide()">
    <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeSizeGuide()" class="absolute top-3 right-3 text-gray-500 hover:text-black text-xl font-bold">&times;</button>
      <h3 class="text-lg font-bold text-gray-900 mb-2 flex items-center gap-2">
        <i class="fas fa-ruler-horizontal text-[#0b6643]"></i> Guía de Tallas y Medidas
      </h3>
      <p class="text-xs text-gray-500 mb-4">Medidas aproximadas expresadas en centímetros.</p>
      
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-2 font-bold">Talla</th>
              <th class="p-2 font-bold">Contorno (cm)</th>
              <th class="p-2 font-bold">Largo / Ancho</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <tr><td class="p-2 font-semibold">S</td><td class="p-2">52 - 55 cm</td><td class="p-2">Pequeño / Ajustado</td></tr>
            <tr><td class="p-2 font-semibold">M</td><td class="p-2">56 - 58 cm</td><td class="p-2">Estándar / Mediano</td></tr>
            <tr><td class="p-2 font-semibold">L</td><td class="p-2">59 - 61 cm</td><td class="p-2">Grande</td></tr>
            <tr><td class="p-2 font-semibold">XL</td><td class="p-2">62 + cm</td><td class="p-2">Extra Grande</td></tr>
          </tbody>
        </table>
      </div>
      <button onclick="closeSizeGuide()" class="w-full mt-5 bg-black text-white py-2 rounded-lg text-xs font-bold uppercase tracking-wider">Entendido</button>
    </div>
  </div>

  <!-- Sidebar del Carrito -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-xl">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h2 class="text-xl font-bold">Tu Pedido</h2>
          <button onclick="toggleCart()" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="mt-4 space-y-4 max-h-[60vh] overflow-y-auto">
          <!-- Items del carrito -->
        </div>
      </div>
      
      <div class="border-t pt-4">
        <div class="flex justify-between text-lg font-bold mb-4">
          <span>Total:</span>
          <span id="cart-total">Bs.0</span>
        </div>
        <button onclick="sendCartWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2">
          <i class="fab fa-whatsapp text-xl"></i> Enviar Carrito por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Vista Previa / Imagen Grande con Navegación -->
  <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-2 sm:p-4 touch-none" onclick="closeImageModal()">
    
    <!-- Botón de Cierre -->
    <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white text-3xl font-bold z-50 p-2 focus:outline-none hover:text-gray-300">&times;</button>

    <!-- Flecha Izquierda -->
    <button onclick="event.stopPropagation(); prevModalImage();" class="absolute left-2 sm:left-6 text-white text-2xl sm:text-4xl bg-black bg-opacity-40 hover:bg-opacity-70 p-3 rounded-full z-50 transition focus:outline-none">
      <i class="fas fa-chevron-left"></i>
    </button>

    <!-- Contenedor de la Imagen Ampliada -->
    <div class="relative max-w-4xl max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="modal-image" src="" alt="Vista previa" class="max-w-full max-h-[80vh] sm:max-h-[85vh] object-contain rounded-lg shadow-2xl transition-all duration-200">
    </div>

    <!-- Flecha Derecha -->
    <button onclick="event.stopPropagation(); nextModalImage();" class="absolute right-2 sm:right-6 text-white text-2xl sm:text-4xl bg-black bg-opacity-40 hover:bg-opacity-70 p-3 rounded-full z-50 transition focus:outline-none">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <!-- Pie de Página -->
  <footer class="bg-[#0b6643] text-white mt-12 border-t border-green-800">
    <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col md:flex-row items-center justify-between gap-6">

        <span class="text-sm font-semibold tracking-wide">@Trekkinero</span>

  </footer>

          uv: "UPF 50+",
          peso: "90.72g",
          uso: "Trekking"
        },
        images: [
          "https://i.postimg.cc/kMVrmByb/orr1.jpg",
          "https://i.postimg.cc/xjkr2cPk/orr2.jpg",
          "https://i.postimg.cc/CMZygz4b/orr3.jpg",
          "https://i.postimg.cc/VsSy8dFn/orr4.jpg",
          "https://i.postimg.cc/9X43hrBJ/orr5.jpg"
        ]
      },
      {

        code: "SOM-018",
        name: "Sombrero OR (Gore-tex)",
        price: 120,
        category: "sombreros",
        sizes: ["M"],
        specs: {
          material: "Gore-tex, para la lluvia",
          uv: "UPF 50+",
          peso: "90.72g",
          uso: "Trekking"
        },
        images: [
          "https://i.postimg.cc/RFNY4Dwt/or1.jpg",
          "https://i.postimg.cc/76fRwWSG/oe2.jpg",
          "https://i.postimg.cc/FR8BRVxc/or3.jpg",
          "https://i.postimg.cc/RFyDFLT3/or4.jpg",
          "https://i.postimg.cc/vBkNBtv0/or5.jpg"
        ]
      },
      {
        id: 55, 
        code: "PLR-001", 
        name: "Cinturón Arc'teryx", 
        price: 370, 
        category: "varios", 
        sizes: ["L"],
        specs: {
          material: "Hebilla de Metal, 100% Naylon",
          uv: "N/A",
          peso: "??g",
          uso: "Urbano / Outdoor"
        },
        images: [
          "https://i.postimg.cc/5y8pVgww/arc2.jpg",
          "https://i.postimg.cc/Zn6jSHrP/arc3.jpg",
          "https://i.postimg.cc/br1LhgQn/arc4.jpg",
          "https://i.postimg.cc/sx5KrmpY/arc5.jpg"
        ]
      }
    ];

    let cart = [];
    let currentCategory = "todos";
    let currentModalProductId = null;
    let currentModalImgIndex = 0;

    // Lógica del botón Limpiar (X) en el buscador
    function toggleClearButton() {
      const input = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-search-btn");
      if (input.value.trim().length > 0) {
        clearBtn.classList.remove("hidden");
        clearBtn.classList.add("flex");
      } else {
        clearBtn.classList.add("hidden");
        clearBtn.classList.remove("flex");
      }
    }

    function clearSearch() {
      const input = document.getElementById("search-input");
      input.value = "";
      toggleClearButton();
      filterProducts();
      input.focus();
    }

    // Abrir y cerrar modal Guía de Tallas
    function openSizeGuide() {
      document.getElementById("size-guide-modal").classList.remove("hidden");
    }

    function closeSizeGuide() {
      document.getElementById("size-guide-modal").classList.add("hidden");
    }

    // Toggle de la Ficha Técnica Desplegable
    function toggleSpecs(productId) {
      const specBox = document.getElementById(`specs-${productId}`);
      specBox.classList.toggle("hidden");
    }

    // Filtros y Búsqueda
    function filterProducts() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = currentCategory === "todos" || p.category === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    function filterCategory(cat) {
      currentCategory = cat;
      filterProducts();
    }

    // Funciones del Modal de Vista Previa con Navegación
    function openImageModal(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      currentModalProductId = productId;
      
      // Encontrar el índice de la foto que se está mostrando actualmente
      const currentSrc = document.getElementById(`main-img-${productId}`).src;
      const index = prod.images.findIndex(img => currentSrc.includes(img) || img.includes(currentSrc));
      currentModalImgIndex = index >= 0 ? index : 0;

      updateModalImage();
      document.getElementById("image-modal").classList.remove("hidden");
    }

    function updateModalImage() {
      const prod = products.find(p => p.id === currentModalProductId);
      if (prod && prod.images[currentModalImgIndex]) {
        document.getElementById("modal-image").src = prod.images[currentModalImgIndex];
      }
    }

    function nextModalImage() {
      const prod = products.find(p => p.id === currentModalProductId);
      if (!prod) return;
      currentModalImgIndex = (currentModalImgIndex + 1) % prod.images.length;
      updateModalImage();
    }

    function prevModalImage() {
      const prod = products.find(p => p.id === currentModalProductId);
      if (!prod) return;
      currentModalImgIndex = (currentModalImgIndex - 1 + prod.images.length) % prod.images.length;
      updateModalImage();
    }

    function closeImageModal() {
      document.getElementById("image-modal").classList.add("hidden");
    }

    // Soporte para gestos Swipe en celulares Android
    let touchStartX = 0;
    let touchEndX = 0;

    const modalElement = document.getElementById("image-modal");
    modalElement.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    modalElement.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextModalImage();
      if (touchEndX > touchStartX + 50) prevModalImage();
    }, false);

    // Cambiar la imagen principal al hacer clic en una miniatura
    function changeMainImage(productId, imgUrl) {
      document.getElementById(`main-img-${productId}`).src = imgUrl;
    }

    // Renderizar productos con ficha técnica y guía de tallas
    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">No se encontraron productos que coincidan.</div>`;
        return;
      }

      grid.innerHTML = items.map(p => {
      // Verificar si el producto está vendido o tiene descuento activo
        const isSold = p.sold === true;
        const hasDiscount = p.discount && p.originalPrice;

        return `
          <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border ${isSold ? 'opacity-80' : ''}">
            <div>
              <div class="relative group cursor-pointer" onclick="openImageModal(${p.id})">
                <img id="main-img-${p.id}" src="${p.images[0]}" alt="${p.name}" class="w-full h-64 object-cover transition-all duration-300 group-hover:opacity-90">
        
                <span class="absolute top-2 left-2 bg-black text-white text-xs font-mono px-2 py-1 rounded z-10">
                  Cód: ${p.code}
                </span>

                <!-- Badge de Descuento (Esquina superior derecha si NO está vendido) -->
                ${hasDiscount && !isSold ? `
                  <span class="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow-md uppercase z-10">
                    ${p.discount}% OFF
                  </span>
                ` : ''}

                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition bg-black bg-opacity-20 text-white font-bold text-sm gap-2">
                  <i class="fas fa-search-plus"></i> Ampliar
                </div>
              </div>

              <!-- Reemplaza la sección del mapa de imágenes pequeñas por este bloque -->
              <div class="relative flex items-center group my-2">
                <!-- Flecha Izquierda -->
                <button 
                  onclick="this.nextElementSibling.scrollBy({left: -80, behavior: 'smooth'})" 
                  class="absolute left-0 z-10 bg-black/60 text-white rounded-r p-1 text-xs hidden group-hover:block md:block shadow-md">
                  &#10094;
                </button>

                <!-- Contenedor con Scroll Táctil / Deslizable -->
                <div class="flex gap-1 overflow-x-auto scrollbar-none scroll-smooth px-1 py-1 w-full snap-x">
                  ${p.images.map((img, i) => `
                    <img 
                      src="${img}" 
                      alt="thumb" 
                      onclick="changeMainImage(${p.id}, '${img}')"
                      class="w-10 h-10 object-cover rounded border cursor-pointer flex-shrink-0 snap-start hover:border-[#0b6643] transition-all"
                    >
                  `).join('')}
                </div>

                <!-- Flecha Derecha -->
                <button 
                  onclick="this.previousElementSibling.scrollBy({left: 80, behavior: 'smooth'})" 
                  class="absolute right-0 z-10 bg-black/60 text-white rounded-l p-1 text-xs hidden group-hover:block md:block shadow-md">
                  &#10095;
                </button>
              </div>
            </div>

            <div class="p-4 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-semibold text-gray-900 text-base">${p.name}</h3>
        
                <!-- Bloque de Precios (Vendido, Con Descuento o Normal) --> 
                <div class="mt-1 flex items-center gap-2">
                  ${isSold ? `
                    <span class="text-gray-400 text-base line-through">Bs.${p.price}</span>
                    <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded uppercase">VENDIDO</span>
                  ` : hasDiscount ? `
                    <span class="text-red-600 font-bold text-lg">Bs.${p.price}</span>
                    <span class="text-gray-400 text-sm line-through">Bs.${p.originalPrice}</span>
                  ` : `
                    <span class="text-gray-900 font-bold text-lg">Bs.${p.price}</span>
                  `}
                </div>
        
                <!-- Talla con Botón Guía -->
                <div class="mt-3">
                  <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-gray-500 uppercase">Talla:</label>
                    <button onclick="openSizeGuide()" class="text-[11px] text-[#0b6643] hover:underline font-medium flex items-center gap-1">
                      <i class="fas fa-ruler-horizontal"></i> Guía de tallas
                    </button>
                  </div>
                  <select id="size-select-${p.id}" ${isSold ? 'disabled' : ''} class="w-full border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-black ${isSold ? 'cursor-not-allowed text-gray-400' : ''}">
                    ${p.sizes.map(size => `<option value="${size}">${size}</option>`).join('')}
                  </select>
                </div>

                <!-- Ficha Técnica Desplegable -->
                <div class="mt-3 border-t pt-2">
                  <button onclick="toggleSpecs(${p.id})" class="text-xs font-semibold text-gray-600 hover:text-black flex items-center justify-between w-full py-1">
                    <span><i class="fas fa-list-ul mr-1"></i> Especificaciones técnicas</span>
                    <i class="fas fa-chevron-down text-[10px]"></i>
                  </button>
                  <div id="specs-${p.id}" class="hidden mt-2 p-2.5 bg-gray-50 rounded-lg text-xs space-y-1 text-gray-600 border">
                    <p><strong>Material:</strong> ${p.specs.material}</p>
                    <p><strong>Protección UV:</strong> ${p.specs.uv}</p>
                    <p><strong>Peso aprox:</strong> ${p.specs.peso}</p>
                    <p><strong>Uso ideal:</strong> ${p.specs.uso}</p>
                  </div>
                </div>
              </div>

              <!-- Accion -->
              <div class="mt-4 space-y-2">
                ${isSold ? `
                  <button disabled class="w-full bg-gray-300 text-gray-500 py-2 rounded-lg text-sm font-medium cursor-not-allowed uppercase">
                    Agotado / Vendido
                  </button>
                ` : `
                  <button onclick="sendDirectWhatsApp(${p.id})" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 transition">
                    <i class="fab fa-whatsapp"></i> Pedir directo
                  </button>
                  <button onclick="addToCart(${p.id})" class="w-full bg-black hover:bg-gray-800 text-white py-2 rounded-lg text-sm font-medium transition">
                    Agregar al carrito
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }



    // Pedido directo por producto
    function sendDirectWhatsApp(productId) {
      const prod = products.find(p => p.id === productId);
      const selectedSize = document.getElementById(`size-select-${productId}`).value;

      const hasDiscount = prod.discount && prod.originalPrice;
      const priceInfo = hasDiscount
        ? `Bs.${prod.price} (Oferta ${prod.discount}% OFF - Precio normal: Bs.${prod.originalPrice})`
        : `Bs.${prod.price}`;

      const message = `*Hola Trekkinero!* Me interesa comprar el siguiente producto:\n\n` +
                      `• *Código:* ${prod.code}\n` +
                      `• *Producto:* ${prod.name}\n` +
                      `• *Talla:* ${selectedSize}\n` +
                      `• *Precio:* Bs.${priceInfo}\n\n` +
                      `¿Aún está disponible?`;
      
      const url = `https://wa.me/${59168773185}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    // Gestión del Carrito
    function addToCart(productId) {
      const prod = products.find(p => p.id === productId);
      const selectedSize = document.getElementById(`size-select-${productId}`).value;

      if(prod && prod.sold){
        alert("Este producto ya ha sido vendido.");
        return;
      }
      const cartIndex = cart.findIndex(item => item.id === productId && item.selectedSize === selectedSize);

      if (cartIndex > -1) {
        cart[cartIndex].quantity++;
      } else {
        cart.push({ ...prod, selectedSize, quantity: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById("cart-items");
      const count = document.getElementById("cart-count");
      const total = document.getElementById("cart-total");

      count.textContent = cart.reduce((sum, p) => sum + p.quantity, 0);
      const sumTotal = cart.reduce((sum, p) => sum + (p.price * p.quantity), 0);
      total.textContent = `Bs.${sumTotal}`;

      container.innerHTML = cart.map((p, index) => `
        <div class="flex items-center gap-3 border-b pb-2">
          <!-- Imagen añadida del producto -->
          <img src="${p.images[0]}" alt="${p.name}" class="w-12 h-12 object-cover rounded-md border flex-shrink-0">
          
          <div class="flex-grow">
            <h4 class="font-semibold text-sm line-clamp-1">${p.name}</h4>
            <span class="text-xs font-mono text-gray-500">Cód: ${p.code} | Talla: <b>${p.selectedSize}</b></span>
            <p class="text-xs text-gray-500">Bs.${p.price} x ${p.quantity}</p>
          </div>

          <div class="flex items-center gap-2">
            <span class="font-bold text-sm">Bs.${p.price * p.quantity}</span>
            <button onclick="removeFromCart(${index})" class="text-red-500 text-sm ml-1">&times;</button>
          </div>
        </div>
      `).join("");
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById("cart-modal").classList.toggle("hidden");
    }

    // Enviar pedido completo del carrito por WhatsApp
    function sendCartWhatsApp() {
      if (cart.length === 0) return alert("Tu carrito está vacío");

      let message = "Hola Trekkinero! Quisiera realizar el siguiente pedido:\n\n";
      cart.forEach(p => {
        message += `• [${p.code}] ${p.name} (Talla: ${p.selectedSize}) x${p.quantity} - Bs.${p.price * p.quantity}\n`;
      });
      
      const total = cart.reduce((sum, p) => sum + (p.price * p.quantity), 0);
      message += `\n*Total a pagar:* Bs.${total}`;

      const url = `https://wa.me/${59168773185}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    // Inicializar el catálogo
    renderProducts(products);
  </script>
